<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (() => {
        let savedLanguage = null;
        try {
          savedLanguage = localStorage.getItem("language");
        } catch {}
        const language = savedLanguage === "zh" || savedLanguage === "en"
          ? savedLanguage
          : navigator.language.toLowerCase().startsWith("zh") ? "zh" : "en";
        const theme = window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
        const root = document.documentElement;
        root.classList.toggle("dark", theme === "dark");
        root.dataset.theme = theme;
        root.dataset.themeMode = "system";
        root.lang = language === "zh" ? "zh-CN" : "en";
        root.dataset.language = language;
        root.style.colorScheme = theme;
        const titles = language === "zh"
          ? {
              home: "馋香鸡 - 专注做饭的极简工具",
              privacy: "馋香鸡 - 隐私政策",
              support: "馋香鸡 - 支持",
            }
          : {
              home: "YumChicken - A Minimalist Cooking Tool",
              privacy: "YumChicken - Privacy Policy",
              support: "YumChicken - Support",
            };
        const pathname = window.location.pathname.replace(/\/+$/, "");
        document.title = pathname.endsWith("/privacy")
            ? titles.privacy
            : pathname.endsWith("/support")
              ? titles.support
              : titles.home;
      })();
    </script>
    <meta name="theme-color" content="#f9f9f7" />
    <script>
      document
        .querySelector('meta[name="theme-color"]')
        ?.setAttribute(
          "content",
          document.documentElement.dataset.theme === "dark" ? "#1c1c1a" : "#f9f9f7",
        );
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="馋香鸡是一款简洁的本地菜谱与做饭助手。"
    />
    <link rel="icon" type="image/png" sizes="256x256" href="%BASE_URL%assets/YumChick/YumChick-iOS-Default-128@2x.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png?v=yumchick-default-20260913" />
    <title>馋香鸡 - 专注做饭的极简工具</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
