<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Jazmín's personal homepage">
    <link rel="icon" href="%BASE_URL%assets/avatar.ico">
    <title>Jazmín’s Homepage</title>
    <script>
      (() => {
        let savedTheme = null;
        let savedLanguage = null;
        try {
          savedTheme = localStorage.getItem("theme");
          savedLanguage = localStorage.getItem("language");
        } catch {}
        const language = savedLanguage === "zh" || savedLanguage === "en"
          ? savedLanguage
          : navigator.language.toLowerCase().startsWith("zh") ? "zh" : "en";
        const mode = savedTheme === "light" || savedTheme === "dark" || savedTheme === "system"
          ? savedTheme
          : "system";
        const theme = mode === "system"
          ? matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"
          : mode;
        document.documentElement.classList.toggle("dark", theme === "dark");
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.themeMode = mode;
        document.documentElement.lang = language === "zh" ? "zh-CN" : "en";
        document.documentElement.dataset.language = language;
        document.documentElement.style.colorScheme = theme;
        document.title = language === "zh" ? "Jazmín 的个人主页" : "Jazmín’s Homepage";
        document.querySelector('meta[name="description"]')?.setAttribute(
          "content",
          language === "zh"
            ? "Jazmín 的个人主页、独立开发作品与 GitHub 项目。"
            : "Jazmín’s personal homepage, independent apps, and GitHub projects.",
        );
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
