name: Rebuild MacMix website

on:
  push:
    branches: [main]
  release:
    types: [published, edited, deleted]
  workflow_run:
    workflows: [Build, Notarize, and Release]
    types: [completed]
  workflow_dispatch:

permissions: {}

concurrency:
  group: rebuild-macmix-website
  cancel-in-progress: false

jobs:
  notify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Request Cloudflare Pages rebuild
        env:
          DEPLOY_HOOK: ${{ secrets.MACMIX_PAGES_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo '::error::Configure MACMIX_PAGES_DEPLOY_HOOK with the MacMix Cloudflare Pages production deploy hook.'
            exit 1
          fi
          curl --fail --silent --show-error --request POST "$DEPLOY_HOOK" --output /dev/null
