<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (() => {
        let savedLanguage = null;
        try {
          savedLanguage = localStorage.getItem("language");
        } catch {}
        const language = savedLanguage === "zh" || savedLanguage === "en"
          ? savedLanguage
          : navigator.language.toLowerCase().startsWith("zh") ? "zh" : "en";
        const theme = window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
        const root = document.documentElement;
        root.classList.toggle("dark", theme === "dark");
        root.dataset.theme = theme;
        root.dataset.themeMode = "system";
        root.lang = language === "zh" ? "zh-CN" : "en";
        root.dataset.language = language;
        root.style.colorScheme = theme;
        const titles = language === "zh"
          ? {
              home: "MacMix — 你的Mac音量，尽在MacMix",
              changelog: "MacMix - 更新日志",
              privacy: "MacMix - 隐私政策",
              terms: "MacMix - 使用条款",
            }
          : {
              home: "MacMix — Mac's sound. All in MacMix.",
              changelog: "MacMix - Changelog",
              privacy: "MacMix - Privacy Policy",
              terms: "MacMix - Terms of Use",
            };
        const pathname = window.location.pathname.replace(/\/+$/, "");
        document.title = pathname.endsWith("/changelog")
          ? titles.changelog
          : pathname.endsWith("/privacy-policy")
            ? titles.privacy
            : pathname.endsWith("/terms-of-use")
              ? titles.terms
              : titles.home;
      })();
    </script>

      name="theme-color"
      content="#f5f2ec"
      media="(prefers-color-scheme: light)"
    />
    <meta
